services:
  - type: web
    name: rastgele-anonim-sohbet
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: CONTROLLER_NAME
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CONSENT_VERSION
        value: 2026-01
